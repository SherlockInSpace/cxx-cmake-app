# Pull request gate: the library template's _gate.yml at a release tag, in
# the cxx-cmake-container ci image named by version and digest, with this
# application's labels, file lists and legs. The jobs after it are the
# application's own. Pushes to main run the full suite (post-merge.yml).
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: SherlockInSpace/cxx-cmake-library/.github/workflows/_gate.yml@v0.4.0
    permissions:
      contents: read
      checks: write
    with:
      image: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
      test-labels: unit|integration
      tidy-files: src/|test/unit/
      format-files: |
        src/*.cpp
        src/*.hpp
        inc/*.hpp
        test/*.cpp

  # By default util comes from the image, through find_package.
  util-from-image:
    name: util resolves from the image
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Configure and check the CPM log
        shell: bash
        run: |
          set -o pipefail
          cmake --preset ci-debug 2>&1 | tee configure.log
          grep -F 'CPM: Using local package util@' configure.log

  # The override a developer uses for a change that spans both repositories:
  # util built from a library checkout next to this one.
  util-from-checkout:
    name: build against a library checkout
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: cxx-cmake-app

      - uses: actions/checkout@v7
        with:
          repository: SherlockInSpace/cxx-cmake-library
          path: cxx-cmake-library

      - name: Configure, build and test with CPM_util_SOURCE
        working-directory: cxx-cmake-app
        run: |
          cmake --preset ci-debug -DCPM_util_SOURCE="$GITHUB_WORKSPACE/cxx-cmake-library"
          test -d build/ci-debug/_deps/util-build
          cmake --build --preset ci-debug
          ctest --preset ci-debug

  # The ENABLE_TRACY build: the zones become Tracy's, linked against the
  # image's TracyClient. The other jobs build them out.
  tracy:
    name: build with Tracy
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure, build and test with ENABLE_TRACY
        run: cmake --workflow --preset tracy

  # The integration tier's Python, linted with pyproject.toml's rules.
  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint the Python
        run: ruff check --no-cache

  # The target preset in the yocto image: the SDK's cross compiler, with util,
  # spdlog and GoogleTest from its sysroot. The binaries are aarch64, so
  # nothing is run.
  target:
    name: cross-compile for the Yocto target
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/yocto:0.1.6@sha256:6cf87e271ce75a517b825a20b1192d377bad290a31638388e5fa84ad88b394f1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure and build with the target preset
        run: |
          . "$YOCTO_SDK_ENV"
          cmake --preset target
          cmake --build --preset target
          readelf -h build/target/app | grep 'Machine:.*AArch64'
