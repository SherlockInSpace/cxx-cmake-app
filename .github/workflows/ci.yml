# Interim build-and-test job until the library template's reusable gate takes
# over (#12): ci-debug in the cxx-cmake-container ci image, named by version
# and digest, which has util and spdlog installed.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure, build and test (warnings are errors)
        shell: bash
        run: |
          set -o pipefail
          cmake --workflow --preset ci-debug 2>&1 | tee workflow.log

      # By default util comes from the image, through find_package.
      - name: Check util resolved from the image
        run: |
          grep -F 'CPM: Using local package util@' workflow.log

  # The override a developer uses for a change that spans both repositories:
  # util built from a library checkout next to this one.
  util-from-checkout:
    name: build against a library checkout
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: cxx-cmake-app

      - uses: actions/checkout@v7
        with:
          repository: SherlockInSpace/cxx-cmake-library
          path: cxx-cmake-library

      - name: Configure, build and test with CPM_util_SOURCE
        working-directory: cxx-cmake-app
        run: |
          cmake --preset ci-debug -DCPM_util_SOURCE="$GITHUB_WORKSPACE/cxx-cmake-library"
          test -d build/ci-debug/_deps/util-build
          cmake --build --preset ci-debug
          ctest --preset ci-debug

  # The ENABLE_TRACY build: the zones become Tracy's, linked against the
  # image's TracyClient. The other jobs build them out.
  tracy:
    name: build with Tracy
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure, build and test with ENABLE_TRACY
        run: cmake --workflow --preset tracy

  # clang-tidy reads each file's flags from compile_commands.json, so the tree
  # is configured with clang. .clang-tidy makes every warning an error.
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 30
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Configure with clang
        run: cmake --preset ci-debug

      - name: Run clang-tidy
        run: run-clang-tidy -quiet -p build/ci-debug 'src/|test/unit/'

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The checkout belongs to the runner's user and the container runs as
      # root, so git needs telling that the directory is safe.
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          clang-format --dry-run -Werror $(git ls-files 'src/*.cpp' 'src/*.hpp' 'inc/*.hpp' 'test/*.cpp')
