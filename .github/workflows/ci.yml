# Interim build-and-test job until the library template's reusable gate takes
# over (#12): ci-debug in the cxx-cmake-container ci image, named by version
# and digest, which has util and spdlog installed.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.5@sha256:03884a80512bdfe862456d2be4be5a5f3f5fd0bf1f75854c60d8b3ccc22ea1ad
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure, build and test (warnings are errors)
        run: cmake --workflow --preset ci-debug
